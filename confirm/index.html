<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spielolympiade – E-Mail bestätigen</title>
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,500;0,700;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #1D9E75;
      --green-light: #E1F5EE;
      --green-dark: #085041;
      --black: #0a0a0a;
      --white: #fafaf8;
      --grey: #888;
      --border: #e8e8e5;
      --red: #E24B4A;
      --red-light: #FEE2E2;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--white);
      color: var(--black);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    nav {
      display: flex; justify-content: space-between; align-items: center;
      padding: 18px 32px;
      background: rgba(250,250,248,0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo {
      font-family: 'Fraunces', serif;
      font-size: 18px; font-weight: 700;
      color: var(--black);
      text-decoration: none;
      display: flex; align-items: center; gap: 8px;
    }
    .nav-logo img { width: 40px; height: 40px; object-fit: contain; }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      background:
        radial-gradient(ellipse 60% 50% at 50% 0%, rgba(29,158,117,0.10) 0%, transparent 70%),
        var(--white);
    }

    .card {
      background: white;
      border-radius: 24px;
      border: 1px solid var(--border);
      padding: 48px 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.07);
      text-align: center;
      animation: fadeUp 0.5s ease both;
    }

    .card-icon {
      font-size: 48px;
      margin-bottom: 20px;
      display: block;
    }

    .spinner {
      width: 48px; height: 48px;
      border: 3px solid var(--border);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }

    h1 {
      font-family: 'Fraunces', serif;
      font-size: 28px;
      font-weight: 700;
      line-height: 1.15;
      margin-bottom: 12px;
    }

    p {
      font-size: 15px;
      color: var(--grey);
      font-weight: 300;
      line-height: 1.6;
    }

    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px; border-radius: 100px;
      font-size: 13px; font-weight: 500;
      margin-top: 20px;
    }
    .badge.success { background: var(--green-light); color: var(--green-dark); }
    .badge.error { background: var(--red-light); color: var(--red); }

    footer {
      background: var(--black); color: #888;
      padding: 28px 24px;
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      text-align: center;
    }
    .footer-links { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
    .footer-links a { color: #888; text-decoration: none; font-size: 13px; transition: color 0.2s; }
    .footer-links a:hover { color: white; }
    .footer-copy { font-size: 12px; color: #555; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 480px) {
      nav { padding: 14px 20px; }
      .card { padding: 32px 24px; border-radius: 18px; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="/" class="nav-logo">
      <img src="../logo-transperent-background.png" alt="Logo">
      Spielolympiade
    </a>
  </nav>

  <main>
    <div class="card" id="card">
      <div class="spinner"></div>
      <h1>Wird bestätigt…</h1>
      <p>Einen Moment bitte.</p>
    </div>
  </main>

  <footer>
    <div class="footer-links">
      <a href="../impressum.html">Impressum</a>
      <a href="../datenschutz.html">Datenschutzerklärung</a>
      <a href="../agb.html">AGB</a>
    </div>
    <p class="footer-copy">© 2026 Spielolympiade. Alle Rechte vorbehalten.</p>
  </footer>

  <script>
    const { createClient } = supabase;
    const client = createClient(
      'https://ytouhihzxqyyyfsakgym.supabase.co',
      'sb_publishable_Dd1WBx9H8M5DwidvoP5-Iw__dSaBz3P'
    );

    const params = new URLSearchParams(window.location.search);
    const tokenHash = params.get('token_hash');
    const type = params.get('type') ?? 'signup';
    const card = document.getElementById('card');

    if (!tokenHash) {
      card.innerHTML = `
        <span class="card-icon">🔒</span>
        <h1>Kein Token gefunden</h1>
        <p>Dieser Link ist ungültig. Bitte registriere dich erneut in der App.</p>
      `;
    } else {
      client.auth.verifyOtp({ token_hash: tokenHash, type })
        .then(({ error }) => {
          if (error) {
            card.innerHTML = `
              <span class="card-icon">❌</span>
              <h1>Bestätigung fehlgeschlagen</h1>
              <p>${error.message}</p>
              <span class="badge error">Link abgelaufen oder bereits verwendet</span>
            `;
          } else {
            card.innerHTML = `
              <span class="card-icon">🏆</span>
              <h1>E-Mail bestätigt!</h1>
              <p>Dein Konto ist aktiviert. Öffne die Spielolympiade-App und melde dich an.</p>
              <span class="badge success">✓ Erfolgreich verifiziert</span>
            `;
          }
        });
    }
  </script>

</body>
</html>
