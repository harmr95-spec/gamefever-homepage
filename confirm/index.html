<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Fever – E-Mail bestätigen</title>
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="stylesheet" href="../fonts/fonts.css">
  <script src="../sprache.js"></script>
  <script src="../vendor/supabase-js-2.119.2.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #17805F;
      --green-light: #E1F5EE;
      --green-dark: #085041;
      --black: #0a0a0a;
      --white: #fafaf8;
      --grey: #888;
      --border: #e8e8e5;
      --red: #E24B4A;
      --red-light: #FEE2E2;
    }

    body {
      font-family: 'Nunito', system-ui, sans-serif;
      background: var(--white);
      color: var(--black);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    nav {
      display: flex; justify-content: space-between; align-items: center;
      padding: 18px 32px;
      background: rgba(250,250,248,0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo {
      font-family: 'Nunito', system-ui, sans-serif;
      font-size: 18px; font-weight: 700;
      color: var(--black);
      text-decoration: none;
      display: flex; align-items: center; gap: 8px;
    }
    .nav-logo img { width: 40px; height: 40px; object-fit: contain; }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      background:
        radial-gradient(ellipse 60% 50% at 50% 0%, rgba(29,158,117,0.10) 0%, transparent 70%),
        var(--white);
    }

    .card {
      background: white;
      border-radius: 24px;
      border: 1px solid var(--border);
      padding: 48px 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.07);
      text-align: center;
      animation: fadeUp 0.5s ease both;
    }

    .card-icon {
      font-size: 48px;
      margin-bottom: 20px;
      display: block;
    }

    .spinner {
      width: 48px; height: 48px;
      border: 3px solid var(--border);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }

    h1 {
      font-family: 'Nunito', system-ui, sans-serif;
      font-size: 28px;
      font-weight: 700;
      line-height: 1.15;
      margin-bottom: 12px;
    }

    p {
      font-size: 15px;
      color: var(--grey);
      font-weight: 300;
      line-height: 1.6;
    }

    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 14px; border-radius: 100px;
      font-size: 13px; font-weight: 500;
      margin-top: 20px;
    }
    .badge.success { background: var(--green-light); color: var(--green-dark); }
    .badge.error { background: var(--red-light); color: var(--red); }

    footer {
      background: var(--black); color: #888;
      padding: 28px 24px;
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      text-align: center;
    }
    .footer-links { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
    .footer-links a { color: #888; text-decoration: none; font-size: 13px; transition: color 0.2s; }
    .footer-links a:hover { color: white; }
    .footer-copy { font-size: 12px; color: #555; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 480px) {
      nav { padding: 14px 20px; }
      .card { padding: 32px 24px; border-radius: 18px; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="/" class="nav-logo">
      <img src="../logo.webp" alt="Logo">
      Game Fever
    </a>
  </nav>

  <main>
    <div class="card" id="card">
      <div class="spinner"></div>
      <h1 data-t="laedtTitel">Wird bestätigt…</h1>
      <p data-t="laedtText">Einen Moment bitte.</p>
    </div>
  </main>

  <footer>
    <div class="footer-links">
      <a href="../impressum.html" data-t="fussImpressum" data-t-href="fussImpressumLink">Impressum</a>
      <a href="../datenschutz.html" data-t="fussDatenschutz" data-t-href="fussDatenschutzLink">Datenschutzerklärung</a>
      <a href="../nutzungsbedingungen.html" data-t="fussNutzung" data-t-href="fussNutzungLink">Nutzungsbedingungen</a>
      <a href="../konto-loeschen/" data-t="fussLoeschen">Konto löschen</a>
      
    </div>
    <p class="footer-copy" data-t="fussCopy">© 2026 Game Fever. Alle Rechte vorbehalten.</p>
  </footer>

  <script>
    // Die Bestätigungsmail von Supabase verlinkt hierher mit ?token_hash=…&type=signup (bzw. email / email_change).
    // Die Sitzung wird im Browser nicht gespeichert – angemeldet wird man danach in der App.
    const L = texteFuer({
      de: {
        seitenTitel: 'Game Fever – E-Mail bestätigen',
        laedtTitel: 'Wird bestätigt…', laedtText: 'Einen Moment bitte.',
        unvollstaendigTitel: 'Link unvollständig',
        unvollstaendigText: 'Dieser Link ist nicht vollständig. Öffne den Link direkt aus der Mail oder registriere dich erneut in der App.',
        fehlerTitel: 'Bestätigung fehlgeschlagen',
        abgelaufenText: 'Der Link ist abgelaufen oder wurde schon benutzt. Wenn du dich in der App anmelden kannst, ist alles in Ordnung. Sonst melde dich in der App an – dort kannst du dir die Bestätigungsmail erneut schicken lassen.',
        fehlerText: 'Die Bestätigung hat nicht geklappt. Bitte versuche es später erneut oder lass dir in der App eine neue Bestätigungsmail schicken.',
        abgelaufenBadge: 'Link abgelaufen oder bereits verwendet',
        neueEmailText: 'Deine neue E-Mail-Adresse ist bestätigt. Du kannst dieses Fenster schließen.',
        aktiviertText: 'Dein Konto ist aktiviert. Öffne die Game-Fever-App und melde dich an.',
        bestaetigtTitel: 'E-Mail bestätigt!', bestaetigtBadge: '✓ Erfolgreich bestätigt',
      fussImpressum: 'Impressum', fussImpressumLink: '../impressum.html',
      fussDatenschutz: 'Datenschutzerklärung', fussDatenschutzLink: '../datenschutz.html',
      fussNutzung: 'Nutzungsbedingungen', fussNutzungLink: '../nutzungsbedingungen.html',
      fussLoeschen: 'Konto löschen', fussCopy: '© 2026 Game Fever. Alle Rechte vorbehalten.',
      },
      en: {
        seitenTitel: 'Game Fever – Confirm email',
        laedtTitel: 'Confirming…', laedtText: 'One moment please.',
        unvollstaendigTitel: 'Incomplete link',
        unvollstaendigText: 'This link is incomplete. Open the link directly from the email or sign up again in the app.',
        fehlerTitel: 'Confirmation failed',
        abgelaufenText: 'The link has expired or has already been used. If you can sign in to the app, everything is fine. Otherwise sign in to the app – you can have the confirmation email sent again there.',
        fehlerText: 'The confirmation did not work. Please try again later or have a new confirmation email sent from the app.',
        abgelaufenBadge: 'Link expired or already used',
        neueEmailText: 'Your new email address is confirmed. You can close this window.',
        aktiviertText: 'Your account is activated. Open the Game Fever app and sign in.',
        bestaetigtTitel: 'Email confirmed!', bestaetigtBadge: '✓ Successfully confirmed',
      fussImpressum: 'Legal notice', fussImpressumLink: '../en/legal-notice.html',
      fussDatenschutz: 'Privacy policy', fussDatenschutzLink: '../en/privacy.html',
      fussNutzung: 'Terms of use', fussNutzungLink: '../en/terms.html',
      fussLoeschen: 'Delete account', fussCopy: '© 2026 Game Fever. All rights reserved.',
      },
    });

    const client = supabase.createClient(
      'https://ytouhihzxqyyyfsakgym.supabase.co',
      'sb_publishable_Dd1WBx9H8M5DwidvoP5-Iw__dSaBz3P',
      { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } }
    );

    const params = new URLSearchParams(window.location.search);
    const tokenHash = params.get('token_hash');
    const type = params.get('type') ?? 'email';
    const card = document.getElementById('card');

    function zeige(symbol, titel, text, badge) {
      card.innerHTML = `
        <span class="card-icon"></span>
        <h1></h1>
        <p></p>
        ${badge ? '<span class="badge"></span>' : ''}`;
      card.querySelector('.card-icon').textContent = symbol;
      card.querySelector('h1').textContent = titel;
      card.querySelector('p').textContent = text;
      if (badge) {
        const el = card.querySelector('.badge');
        el.textContent = badge.text;
        el.classList.add(badge.art);
      }
    }

    async function start() {
      if (!tokenHash) {
        return zeige('🔒', L('unvollstaendigTitel'), L('unvollstaendigText'));
      }
      const { error } = await client.auth.verifyOtp({ token_hash: tokenHash, type });
      if (error) {
        const abgelaufen = error.code === 'otp_expired' || /expired|invalid/i.test(error.message ?? '');
        return zeige('⏰', L('fehlerTitel'), abgelaufen ? L('abgelaufenText') : L('fehlerText'), { text: L('abgelaufenBadge'), art: 'error' });
      }
      const text = type === 'email_change' ? L('neueEmailText') : L('aktiviertText');
      zeige('🏆', L('bestaetigtTitel'), text, { text: L('bestaetigtBadge'), art: 'success' });
    }

    start();
  </script>

</body>
</html>
