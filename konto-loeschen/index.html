<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Fever – Konto löschen</title>
  <meta name="description" content="So löschst du dein Game-Fever-Konto – in der App oder direkt hier auf der Website.">
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="stylesheet" href="../fonts/fonts.css">
  <script src="../sprache.js"></script>
  <script src="../vendor/supabase-js-2.119.2.js"></script>
  <script src="../captcha.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #17805F;
      --green-light: #E1F5EE;
      --green-dark: #085041;
      --black: #0a0a0a;
      --white: #fafaf8;
      --grey: #888;
      --grey-light: #f0f0f0;
      --border: #e8e8e5;
      --red: #E24B4A;
      --red-light: #FEE2E2;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Nunito', system-ui, sans-serif;
      background: var(--white);
      color: var(--black);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── NAV ── */
    nav {
      display: flex; justify-content: space-between; align-items: center;
      padding: 18px 32px;
      background: rgba(250,250,248,0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo {
      font-family: 'Nunito', system-ui, sans-serif;
      font-size: 18px; font-weight: 700;
      color: var(--black);
      text-decoration: none;
      display: flex; align-items: center; gap: 8px;
    }
    .nav-logo img { width: 40px; height: 40px; object-fit: contain; }

    /* ── MAIN ── */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      background:
        radial-gradient(ellipse 60% 50% at 50% 0%, rgba(29,158,117,0.10) 0%, transparent 70%),
        var(--white);
    }

    .card {
      background: white;
      border-radius: 24px;
      border: 1px solid var(--border);
      padding: 48px 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.07);
      animation: fadeUp 0.5s ease both;
    }

    .card-icon {
      font-size: 40px;
      margin-bottom: 16px;
    }

    .card h1 {
      font-family: 'Nunito', system-ui, sans-serif;
      font-size: 28px;
      font-weight: 700;
      line-height: 1.15;
      margin-bottom: 8px;
    }

    .card-sub {
      font-size: 15px;
      color: var(--grey);
      font-weight: 300;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    /* ── FORM ── */
    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #555;
      margin-bottom: 6px;
    }

    .input-wrap {
      position: relative;
    }

    .captcha { margin: 4px 0 12px; min-height: 65px; }

    input[type="password"], input[type="email"], input[type="text"] {
      width: 100%;
      padding: 12px 44px 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-family: 'Nunito', system-ui, sans-serif;
      font-size: 15px;
      background: var(--white);
      color: var(--black);
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    input[type="password"]:focus, input[type="email"]:focus, input[type="text"]:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(29,158,117,0.12);
    }

    input[type="password"].error {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(226,75,74,0.10);
    }

    .toggle-pw {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      color: var(--grey);
      padding: 2px;
      line-height: 1;
    }

    /* ── REQUIREMENTS ── */
    .requirements {
      background: var(--grey-light);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .req {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--grey);
      transition: color 0.2s;
    }

    .req.ok { color: var(--green); }
    .req.fail { color: var(--red); }

    .req-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #ccc;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .req.ok .req-dot { background: var(--green); }
    .req.fail .req-dot { background: var(--red); }

    /* ── BUTTON ── */
    .btn-submit {
      width: 100%;
      background: var(--black);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-family: 'Nunito', system-ui, sans-serif;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, background 0.2s;
      margin-top: 4px;
    }

    .btn-submit:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    }

    .btn-submit:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    /* ── MESSAGE ── */
    .msg {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
      display: none;
    }

    .msg.show { display: block; }
    .msg.success { background: var(--green-light); color: var(--green-dark); }
    .msg.error-msg { background: var(--red-light); color: var(--red); }

    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 8px auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── INVALID STATE ── */
    .invalid-state {
      text-align: center;
      padding: 16px 0;
    }
    .invalid-state .card-icon { font-size: 48px; }

    /* ── FOOTER ── */
    footer {
      background: var(--black); color: #888;
      padding: 28px 24px;
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      text-align: center;
    }
    .footer-links { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
    .footer-links a {
      color: #888; text-decoration: none;
      font-size: 13px; transition: color 0.2s;
    }
    .footer-links a:hover { color: white; }
    .footer-copy { font-size: 12px; color: #555; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      nav { padding: 14px 20px; }
      .card { padding: 32px 24px; border-radius: 18px; }
    }

    input[type="email"] { padding-right: 14px; }

    .card a { color: var(--green); }
    .info {
      background: var(--grey-light);
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 24px;
      font-size: 14px;
      line-height: 1.55;
    }
    .info h2 { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
    .info ul { padding-left: 18px; }
    .info li { margin-bottom: 4px; }
    .info + .info { margin-top: -12px; }

    .divider {
      display: flex; align-items: center; gap: 12px;
      color: var(--grey); font-size: 13px;
      margin: 4px 0 20px;
    }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    .link-btn {
      background: none; border: none; padding: 0;
      font-family: inherit; font-size: 13px; color: var(--green);
      cursor: pointer; text-decoration: underline;
    }
    .link-row { margin: -4px 0 16px; text-align: right; }

    .check {
      display: flex; gap: 10px; align-items: flex-start;
      font-size: 14px; line-height: 1.5;
      margin: 8px 0 20px;
      cursor: pointer;
    }
    .check input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--red); flex-shrink: 0; }

    .btn-danger { background: var(--red); }
    .btn-danger:disabled { background: #ccc; }
    .btn-secondary {
      width: 100%;
      background: none;
      color: var(--black);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      font-family: 'Nunito', system-ui, sans-serif;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
    }
    .konto { font-weight: 700; word-break: break-all; }
    .klein { font-size: 13px; color: var(--grey); line-height: 1.55; margin-top: 24px; }
  </style>
</head>
<body>

  <nav>
    <a href="/" class="nav-logo">
      <img src="../logo.webp" alt="Logo">
      Game Fever
    </a>
  </nav>

  <main>
    <div class="card" id="card">
      <noscript>
        <h1>Konto löschen · Delete account</h1>
        <p class="card-sub">Du kannst dein Konto in der App löschen: Profil → „Konto löschen“. Für das Löschen auf dieser Seite wird JavaScript benötigt.</p>
        <p class="card-sub">You can delete your account in the app: Profile → “Delete account”. Deleting on this page requires JavaScript.</p>
      </noscript>
    </div>
  </main>

  <footer>
    <div class="footer-links">
      {% include fuss-links.html sprache="auto" %}
      <span data-sprachwahl data-de="?lang=de" data-en="?lang=en"></span>
    </div>
    {% include fuss-copy.html sprache="auto" %}
  </footer>

  <script>
    // Konto löschen ohne App (verlangt z. B. Google Play):
    // 1. Anmelden mit E-Mail und Passwort (Sitzung nur im sessionStorage, nur für diesen Vorgang).
    // 2. Ausdrücklich bestätigen.
    // 3. Dieselbe Edge Function wie die App aufrufen (delete-user) – Löschkonzept siehe Datenschutzerklärung, Abschnitt 13.
    const L = texteFuer({
      de: {
        seitenTitel: "Game Fever – Konto löschen",
        falsch: "E-Mail oder Passwort stimmen nicht.",
        unbestaetigt: "Diese E-Mail-Adresse wurde noch nicht bestätigt. Ein unbestätigtes Konto kannst du über die Adresse im Impressum löschen lassen.",
        zuViele: "Zu viele Versuche. Bitte warte einen Moment und versuche es dann erneut.",
        keineVerbindung: "Keine Verbindung. Bitte prüfe deine Internetverbindung.",
        sonst: "Etwas ist schiefgelaufen. Bitte versuche es erneut.",
        wasPassiert: "Was dabei passiert",
        geloescht: "<strong>Gelöscht:</strong> E-Mail, Passwort, Alias, Name, Profilbild, Freundschaften und deine Spielesammlung.",
        ersetzt: "<strong>Ersetzt:</strong> Deine Chat-Nachrichten, Bewertungs- und Empfehlungstexte lauten danach nur noch „User gelöscht“.",
        anonym: "<strong>Anonymisiert:</strong> In Wettbewerben und vergangenen Spieleabenden deiner Mitspieler erscheinst du als „Gelöschter User“.",
        details: "Alle Einzelheiten stehen in der <a href=\"{link}\">Datenschutzerklärung</a>.",
        detailsLink: "../datenschutz.html#loeschung",
        titel: "Konto löschen",
        inApp: "Am einfachsten geht es in der App: <strong>Profil → „Konto löschen“</strong>. Du kannst dein Konto aber auch hier löschen.",
        hierLoeschen: "Hier löschen",
        email: "E-Mail",
        emailPlatzhalter: "name@beispiel.de",
        passwort: "Passwort",
        passwortPlatzhalter: "Dein Passwort",
        captchaFehler: "Die Sicherheitsprüfung konnte nicht abgeschlossen werden. Bitte lade die Seite neu.",
        anzeigen: "Passwort anzeigen",
        verbergen: "Passwort verbergen",
        vergessen: "Passwort vergessen?",
        weiter: "Anmelden und weiter",
        keinZugang: "Kein Zugang mehr zu deinem Konto? Schreib uns über die Adresse im <a href=\"{link}\">Impressum</a> – wir löschen es dann für dich, spätestens innerhalb eines Monats.",
        impressumLink: "../impressum.html",
        leer: "Bitte gib E-Mail und Passwort ein.",
        prueft: "Wird geprüft…",
        emailZuerst: "Gib zuerst deine E-Mail-Adresse ein.",
        linkGeschickt: "Falls ein Konto zu dieser Adresse existiert, haben wir dir einen Link zum Zurücksetzen geschickt.",
        wirklich: "Wirklich löschen?",
        angemeldetAls: "Angemeldet als <span class=\"konto\" id=\"konto\"></span>. Das Löschen kann nicht rückgängig gemacht werden.",
        endgueltigCheck: "Ich möchte mein Konto endgültig löschen.",
        endgueltig: "Konto endgültig löschen",
        abbrechen: "Abbrechen",
        loescht: "Wird gelöscht…",
        loeschFehler: "Das Löschen hat nicht geklappt. Bitte versuche es erneut oder schreib uns über die Adresse im Impressum.",
        erledigt: "Konto gelöscht",
        erledigtText: "Dein Game-Fever-Konto wurde gelöscht. Wenn die App noch auf deinem Handy installiert ist, kannst du sie einfach deinstallieren.",
      },
      en: {
        seitenTitel: "Game Fever – Delete account",
        falsch: "Email or password is incorrect.",
        unbestaetigt: "This email address has not been confirmed yet. You can have an unconfirmed account deleted via the address in the legal notice.",
        zuViele: "Too many attempts. Please wait a moment and try again.",
        keineVerbindung: "No connection. Please check your internet connection.",
        sonst: "Something went wrong. Please try again.",
        wasPassiert: "What happens",
        geloescht: "<strong>Deleted:</strong> email, password, alias, name, profile picture, friendships and your game collection.",
        ersetzt: "<strong>Replaced:</strong> your chat messages, review and recommendation texts will then only read “User deleted”.",
        anonym: "<strong>Anonymised:</strong> in competitions and past game nights of your fellow players you will appear as “Deleted user”.",
        details: "All details are in the <a href=\"{link}\">privacy policy</a>.",
        detailsLink: "../en/privacy.html#loeschung",
        titel: "Delete account",
        inApp: "The easiest way is in the app: <strong>Profile → “Delete account”</strong>. But you can also delete your account here.",
        hierLoeschen: "Delete here",
        email: "Email",
        emailPlatzhalter: "name@example.com",
        passwort: "Password",
        passwortPlatzhalter: "Your password",
        captchaFehler: "The security check could not be completed. Please reload the page.",
        anzeigen: "Show password",
        verbergen: "Hide password",
        vergessen: "Forgot password?",
        weiter: "Sign in and continue",
        keinZugang: "No longer have access to your account? Write to us via the address in the <a href=\"{link}\">legal notice</a> – we will then delete it for you within one month at the latest.",
        impressumLink: "../en/legal-notice.html",
        leer: "Please enter email and password.",
        prueft: "Checking…",
        emailZuerst: "Enter your email address first.",
        linkGeschickt: "If an account exists for this address, we have sent you a link to reset your password.",
        wirklich: "Really delete?",
        angemeldetAls: "Signed in as <span class=\"konto\" id=\"konto\"></span>. Deleting cannot be undone.",
        endgueltigCheck: "I want to delete my account permanently.",
        endgueltig: "Delete account permanently",
        abbrechen: "Cancel",
        loescht: "Deleting…",
        loeschFehler: "Deleting did not work. Please try again or write to us via the address in the legal notice.",
        erledigt: "Account deleted",
        erledigtText: "Your Game Fever account has been deleted. If the app is still installed on your phone, you can simply uninstall it.",
      },
    });

    const client = supabase.createClient(
      'https://ytouhihzxqyyyfsakgym.supabase.co',
      'sb_publishable_Dd1WBx9H8M5DwidvoP5-Iw__dSaBz3P',
      { auth: { storage: window.sessionStorage, persistSession: true, autoRefreshToken: true, detectSessionInUrl: false } }
    );
    const card = document.getElementById('card');
    const zeige = (html) => { card.innerHTML = html; };

    function fehlertext(error) {
      const code = error?.code ?? '';
      const msg = (error?.message ?? '').toLowerCase();
      if (code === 'invalid_credentials' || msg.includes('invalid login'))
        return L('falsch');
      if (code === 'email_not_confirmed' || msg.includes('not confirmed'))
        return L('unbestaetigt');
      if (msg.includes('rate limit') || msg.includes('too many'))
        return L('zuViele');
      if (msg.includes('fetch') || msg.includes('network'))
        return L('keineVerbindung');
      return L('sonst');
    }

    function meldung(text, art) {
      const el = document.getElementById('msg');
      el.textContent = text;
      el.className = 'msg show ' + (art === 'ok' ? 'success' : 'error-msg');
    }

    const WAS_PASSIERT = `
      <div class="info">
        <h2>${L('wasPassiert')}</h2>
        <ul>
          <li>${L('geloescht')}</li>
          <li>${L('ersetzt')}</li>
          <li>${L('anonym')}</li>
        </ul>
        <p style="margin-top:8px">${L('details', { link: L('detailsLink') })}</p>
      </div>`;

    function zeigeAnmelden() {
      zeige(`
        <div class="card-icon">🗑️</div>
        <h1>${L('titel')}</h1>
        <p class="card-sub">${L('inApp')}</p>
        ${WAS_PASSIERT}
        <div class="divider">${L('hierLoeschen')}</div>
        <form id="anmelden" novalidate>
          <div class="field">
            <label for="email">${L('email')}</label>
            <input type="email" id="email" autocomplete="email" placeholder="${L('emailPlatzhalter')}" />
          </div>
          <div class="field">
            <label for="pw">${L('passwort')}</label>
            <div class="input-wrap">
              <input type="password" id="pw" autocomplete="current-password" placeholder="${L('passwortPlatzhalter')}" />
              <button class="toggle-pw" type="button" aria-label="${L('anzeigen')}">👁</button>
            </div>
          </div>
          <div class="link-row"><button class="link-btn" id="vergessen" type="button">${L('vergessen')}</button></div>
          <div class="captcha" id="captcha"></div>
          <button class="btn-submit" id="weiter" type="submit">${L('weiter')}</button>
          <div class="msg" id="msg" role="alert"></div>
        </form>
        <p class="klein">${L('keinZugang', { link: L('impressumLink') })}</p>`);

      const pw = document.getElementById('pw');
      document.querySelector('.toggle-pw').addEventListener('click', (e) => {
        const verdeckt = pw.type === 'password';
        pw.type = verdeckt ? 'text' : 'password';
        e.currentTarget.textContent = verdeckt ? '🙈' : '👁';
        e.currentTarget.setAttribute('aria-label', verdeckt ? L('verbergen') : L('anzeigen'));
      });
      document.getElementById('vergessen').addEventListener('click', passwortVergessen);
      document.getElementById('anmelden').addEventListener('submit', (e) => { e.preventDefault(); anmelden(); });
      captcha = gfCaptcha(document.getElementById('captcha'), { sprache: window.SPRACHE, thema: 'light' });
    }

    // Captcha (Cloudflare Turnstile) – jedes Token gilt nur für einen Versuch
    let captcha = null;
    async function captchaToken() {
      try {
        return await captcha.token();
      } catch {
        meldung(L('captchaFehler'));
        return null;
      }
    }

    async function anmelden() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('pw').value;
      if (!email || !password) return meldung(L('leer'));
      const btn = document.getElementById('weiter');
      btn.disabled = true;
      btn.textContent = L('prueft');
      const token = await captchaToken();
      if (!token) {
        btn.disabled = false;
        btn.textContent = L('weiter');
        return;
      }
      const { data, error } = await client.auth.signInWithPassword({ email, password, options: { captchaToken: token } });
      captcha.neu();
      if (error) {
        btn.disabled = false;
        btn.textContent = L('weiter');
        return meldung(fehlertext(error));
      }
      zeigeBestaetigen(data.user.email);
    }

    async function passwortVergessen() {
      const email = document.getElementById('email').value.trim();
      if (!email) return meldung(L('emailZuerst'));
      const token = await captchaToken();
      if (!token) return;
      const { error } = await client.auth.resetPasswordForEmail(email, {
        redirectTo: 'https://www.gamefeverapp.de/reset-password',
        captchaToken: token,
      });
      captcha.neu();
      if (error) return meldung(fehlertext(error));
      meldung(L('linkGeschickt'), 'ok');
    }

    function zeigeBestaetigen(email) {
      zeige(`
        <div class="card-icon">⚠️</div>
        <h1>${L('wirklich')}</h1>
        <p class="card-sub">${L('angemeldetAls')}</p>
        ${WAS_PASSIERT}
        <label class="check"><input type="checkbox" id="ok" /> <span>${L('endgueltigCheck')}</span></label>
        <button class="btn-submit btn-danger" id="loeschen" type="button" disabled>${L('endgueltig')}</button>
        <button class="btn-secondary" id="abbrechen" type="button">${L('abbrechen')}</button>
        <div class="msg" id="msg" role="alert"></div>`);
      document.getElementById('konto').textContent = email;
      const ok = document.getElementById('ok');
      const btn = document.getElementById('loeschen');
      ok.addEventListener('change', () => { btn.disabled = !ok.checked; });
      btn.addEventListener('click', loeschen);
      document.getElementById('abbrechen').addEventListener('click', async () => {
        await client.auth.signOut({ scope: 'local' });
        zeigeAnmelden();
      });
    }

    async function loeschen() {
      const btn = document.getElementById('loeschen');
      btn.disabled = true;
      btn.textContent = L('loescht');
      document.getElementById('abbrechen').disabled = true;
      const { error } = await client.functions.invoke('delete-user', { method: 'POST' });
      if (error) {
        btn.disabled = false;
        btn.textContent = L('endgueltig');
        document.getElementById('abbrechen').disabled = false;
        return meldung(L('loeschFehler'));
      }
      // Die Sitzung gehört zu einem Konto, das es nicht mehr gibt – nur im Browser vergessen
      sessionStorage.clear();
      zeige(`
        <div class="invalid-state">
          <div class="card-icon">✅</div>
          <h1>${L('erledigt')}</h1>
          <p class="card-sub">${L('erledigtText')}</p>
        </div>`);
    }

    async function start() {
      // Seite neu geladen, während man angemeldet war? Dann direkt zur Bestätigung.
      const { data } = await client.auth.getSession();
      if (data.session) return zeigeBestaetigen(data.session.user.email);
      zeigeAnmelden();
    }

    start();
  </script>

</body>
</html>
