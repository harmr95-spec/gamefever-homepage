<!-- reset-password.html -->
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Passwort zurücksetzen</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h1>Neues Passwort</h1>
  <div id="form">
    <input id="pw" type="password" placeholder="Neues Passwort" />
    <button onclick="reset()">Speichern</button>
    <p id="msg"></p>
  </div>
  <script>
    const { createClient } = supabase;
    const client = createClient('https://ytouhihzxqyyyfsakgym.supabase.co', 'sb_publishable_Dd1WBx9H8M5DwidvoP5-Iw__dSaBz3P');

    const params = new URLSearchParams(window.location.search);
    const tokenHash = params.get('token_hash');

    if (!tokenHash) {
      document.getElementById('msg').textContent = '❌ Kein gültiger Reset-Link.';
      document.getElementById('form').querySelector('button').disabled = true;
    }

    async function reset() {
      const pw = document.getElementById('pw').value;
      if (!pw) return;
      const { error: verifyError } = await client.auth.verifyOtp({ 
        token_hash: tokenHash, 
        type: 'recovery' 
      });
      if (verifyError) { document.getElementById('msg').textContent = '❌ ' + verifyError.message; return; }
      const { error } = await client.auth.updateUser({ password: pw });
      document.getElementById('msg').textContent = error
        ? '❌ ' + error.message
        : '✅ Passwort geändert! Du kannst dich in der App anmelden.';
    }
  </script>
</body>
</html>
