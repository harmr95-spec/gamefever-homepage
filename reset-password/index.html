<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Fever – Passwort zurücksetzen</title>
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="stylesheet" href="../fonts/fonts.css">
  <script src="../sprache.js"></script>
  <script src="../vendor/supabase-js-2.119.2.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #17805F;
      --green-light: #E1F5EE;
      --green-dark: #085041;
      --black: #0a0a0a;
      --white: #fafaf8;
      --grey: #888;
      --grey-light: #f0f0f0;
      --border: #e8e8e5;
      --red: #E24B4A;
      --red-light: #FEE2E2;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Nunito', system-ui, sans-serif;
      background: var(--white);
      color: var(--black);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── NAV ── */
    nav {
      display: flex; justify-content: space-between; align-items: center;
      padding: 18px 32px;
      background: rgba(250,250,248,0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo {
      font-family: 'Nunito', system-ui, sans-serif;
      font-size: 18px; font-weight: 700;
      color: var(--black);
      text-decoration: none;
      display: flex; align-items: center; gap: 8px;
    }
    .nav-logo img { width: 40px; height: 40px; object-fit: contain; }

    /* ── MAIN ── */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      background:
        radial-gradient(ellipse 60% 50% at 50% 0%, rgba(29,158,117,0.10) 0%, transparent 70%),
        var(--white);
    }

    .card {
      background: white;
      border-radius: 24px;
      border: 1px solid var(--border);
      padding: 48px 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.07);
      animation: fadeUp 0.5s ease both;
    }

    .card-icon {
      font-size: 40px;
      margin-bottom: 16px;
    }

    .card h1 {
      font-family: 'Nunito', system-ui, sans-serif;
      font-size: 28px;
      font-weight: 700;
      line-height: 1.15;
      margin-bottom: 8px;
    }

    .card-sub {
      font-size: 15px;
      color: var(--grey);
      font-weight: 300;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    /* ── FORM ── */
    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #555;
      margin-bottom: 6px;
    }

    .input-wrap {
      position: relative;
    }

    input[type="password"] {
      width: 100%;
      padding: 12px 44px 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-family: 'Nunito', system-ui, sans-serif;
      font-size: 15px;
      background: var(--white);
      color: var(--black);
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    input[type="password"]:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(29,158,117,0.12);
    }

    input[type="password"].error {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(226,75,74,0.10);
    }

    .toggle-pw {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      color: var(--grey);
      padding: 2px;
      line-height: 1;
    }

    /* ── REQUIREMENTS ── */
    .requirements {
      background: var(--grey-light);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .req {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--grey);
      transition: color 0.2s;
    }

    .req.ok { color: var(--green); }
    .req.fail { color: var(--red); }

    .req-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #ccc;
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .req.ok .req-dot { background: var(--green); }
    .req.fail .req-dot { background: var(--red); }

    /* ── BUTTON ── */
    .btn-submit {
      width: 100%;
      background: var(--black);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-family: 'Nunito', system-ui, sans-serif;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, background 0.2s;
      margin-top: 4px;
    }

    .btn-submit:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    }

    .btn-submit:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    /* ── MESSAGE ── */
    .msg {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
      display: none;
    }

    .msg.show { display: block; }
    .msg.success { background: var(--green-light); color: var(--green-dark); }
    .msg.error-msg { background: var(--red-light); color: var(--red); }

    .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 8px auto 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── INVALID STATE ── */
    .invalid-state {
      text-align: center;
      padding: 16px 0;
    }
    .invalid-state .card-icon { font-size: 48px; }

    /* ── FOOTER ── */
    footer {
      background: var(--black); color: #888;
      padding: 28px 24px;
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      text-align: center;
    }
    .footer-links { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; }
    .footer-links a {
      color: #888; text-decoration: none;
      font-size: 13px; transition: color 0.2s;
    }
    .footer-links a:hover { color: white; }
    .footer-copy { font-size: 12px; color: #555; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      nav { padding: 14px 20px; }
      .card { padding: 32px 24px; border-radius: 18px; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="/" class="nav-logo">
      <img src="../logo.webp" alt="Logo">
      Game Fever
    </a>
  </nav>

  <main>
    <div class="card" id="card">
      <!-- Wird per JS befüllt -->
    </div>
  </main>

  <footer>
    <div class="footer-links">
      <a href="../impressum.html" data-t="fussImpressum" data-t-href="fussImpressumLink">Impressum</a>
      <a href="../datenschutz.html" data-t="fussDatenschutz" data-t-href="fussDatenschutzLink">Datenschutzerklärung</a>
      <a href="../nutzungsbedingungen.html" data-t="fussNutzung" data-t-href="fussNutzungLink">Nutzungsbedingungen</a>
      <a href="../konto-loeschen/" data-t="fussLoeschen">Konto löschen</a>
      
    </div>
    <p class="footer-copy" data-t="fussCopy">© 2026 Game Fever. Alle Rechte vorbehalten.</p>
  </footer>

  <script>
    // Ablauf: Die Mail von Supabase verlinkt auf diese Seite mit ?token_hash=…&type=recovery.
    // 1. Link sofort prüfen (verifyOtp) – ungültige/abgelaufene Links fallen direkt auf.
    // 2. Formular zeigen, neues Passwort setzen (updateUser).
    // 3. Abmelden: Die Anmeldung im Browser wird nur für diesen Vorgang gebraucht.
    // Die Sitzung liegt nur im sessionStorage, damit ein Neuladen der Seite nicht den Link „verbraucht“.
    const L = texteFuer({
      de: {
        seitenTitel: "Game Fever – Passwort zurücksetzen",
        abgelaufen: "Dieser Link ist abgelaufen oder wurde schon benutzt. Bitte fordere in der App über „Passwort vergessen?“ einen neuen Link an.",
        gleich: "Das neue Passwort muss sich von deinem bisherigen unterscheiden.",
        schwach: "Das Passwort ist zu schwach. Bitte wähle ein längeres oder weniger gängiges Passwort.",
        zuViele: "Zu viele Versuche. Bitte warte einen Moment und versuche es dann erneut.",
        keineVerbindung: "Keine Verbindung. Bitte prüfe deine Internetverbindung.",
        sonst: "Etwas ist schiefgelaufen. Bitte fordere in der App einen neuen Link an.",
        laedt: "Link wird geprüft…",
        moment: "Einen Moment bitte.",
        ungueltig: "Link ungültig",
        geaendert: "Passwort geändert",
        geaendertText: "Du kannst dich jetzt in der Game-Fever-App mit deinem neuen Passwort anmelden. Dieses Fenster kannst du schließen.",
        neu: "Neues Passwort",
        neuText: "Wähle ein sicheres Passwort für dein Game-Fever-Konto.",
        mind8: "Mindestens 8 Zeichen",
        wiederholen: "Passwort wiederholen",
        bestaetigen: "Passwort bestätigen",
        anzeigen: "Passwort anzeigen",
        verbergen: "Passwort verbergen",
        klein: "Kleinbuchstabe (a–z)",
        gross: "Großbuchstabe (A–Z)",
        ziffer: "Ziffer (0–9)",
        gleichPw: "Passwörter stimmen überein",
        speichern: "Passwort speichern",
        speichert: "Wird gespeichert…",
        unvollstaendig: "Dieser Link ist unvollständig. Bitte fordere in der App über „Passwort vergessen?“ einen neuen Link an.",
      fussImpressum: 'Impressum', fussImpressumLink: '../impressum.html',
      fussDatenschutz: 'Datenschutzerklärung', fussDatenschutzLink: '../datenschutz.html',
      fussNutzung: 'Nutzungsbedingungen', fussNutzungLink: '../nutzungsbedingungen.html',
      fussLoeschen: 'Konto löschen', fussCopy: '© 2026 Game Fever. Alle Rechte vorbehalten.',
      },
      en: {
        seitenTitel: "Game Fever – Reset password",
        abgelaufen: "This link has expired or has already been used. Please request a new link in the app via “Forgot password?”.",
        gleich: "The new password must be different from your current one.",
        schwach: "The password is too weak. Please choose a longer or less common password.",
        zuViele: "Too many attempts. Please wait a moment and try again.",
        keineVerbindung: "No connection. Please check your internet connection.",
        sonst: "Something went wrong. Please request a new link in the app.",
        laedt: "Checking link…",
        moment: "One moment please.",
        ungueltig: "Invalid link",
        geaendert: "Password changed",
        geaendertText: "You can now sign in to the Game Fever app with your new password. You can close this window.",
        neu: "New password",
        neuText: "Choose a secure password for your Game Fever account.",
        mind8: "At least 8 characters",
        wiederholen: "Repeat password",
        bestaetigen: "Confirm password",
        anzeigen: "Show password",
        verbergen: "Hide password",
        klein: "Lowercase letter (a–z)",
        gross: "Uppercase letter (A–Z)",
        ziffer: "Digit (0–9)",
        gleichPw: "Passwords match",
        speichern: "Save password",
        speichert: "Saving…",
        unvollstaendig: "This link is incomplete. Please request a new link in the app via “Forgot password?”.",
      fussImpressum: 'Legal notice', fussImpressumLink: '../en/legal-notice.html',
      fussDatenschutz: 'Privacy policy', fussDatenschutzLink: '../en/privacy.html',
      fussNutzung: 'Terms of use', fussNutzungLink: '../en/terms.html',
      fussLoeschen: 'Delete account', fussCopy: '© 2026 Game Fever. All rights reserved.',
      },
    });

    const client = supabase.createClient(
      'https://ytouhihzxqyyyfsakgym.supabase.co',
      'sb_publishable_Dd1WBx9H8M5DwidvoP5-Iw__dSaBz3P',
      { auth: { storage: window.sessionStorage, persistSession: true, autoRefreshToken: false, detectSessionInUrl: false } }
    );

    const params = new URLSearchParams(window.location.search);
    const tokenHash = params.get('token_hash');
    const card = document.getElementById('card');

    // Gleiche Regeln wie in der App (src/auth/fehlertexte.ts → pruefePasswort)
    const REGELN = {
      len:   (pw) => pw.length >= 8,
      lower: (pw) => /[a-z]/.test(pw),
      upper: (pw) => /[A-Z]/.test(pw),
      digit: (pw) => /[0-9]/.test(pw),
    };

    function fehlertext(error) {
      const code = error?.code ?? '';
      const msg = (error?.message ?? '').toLowerCase();
      if (code === 'otp_expired' || msg.includes('expired') || msg.includes('invalid'))
        return L('abgelaufen');
      if (code === 'same_password' || msg.includes('different from the old'))
        return L('gleich');
      if (code === 'weak_password' || msg.includes('weak'))
        return L('schwach');
      if (msg.includes('rate limit') || msg.includes('too many'))
        return L('zuViele');
      if (msg.includes('fetch') || msg.includes('network'))
        return L('keineVerbindung');
      return L('sonst');
    }

    function zeige(html) { card.innerHTML = html; }

    function zeigeLaden() {
      zeige(`
        <div class="invalid-state">
          <div class="spinner"></div>
          <h1>${L('laedt')}</h1>
          <p class="card-sub">${L('moment')}</p>
        </div>`);
    }

    function zeigeUngueltig(text) {
      zeige(`
        <div class="invalid-state">
          <div class="card-icon">🔒</div>
          <h1>${L('ungueltig')}</h1>
          <p class="card-sub" id="grund"></p>
        </div>`);
      document.getElementById('grund').textContent = text;
    }

    function zeigeErfolg() {
      zeige(`
        <div class="invalid-state">
          <div class="card-icon">✅</div>
          <h1>${L('geaendert')}</h1>
          <p class="card-sub">${L('geaendertText')}</p>
        </div>`);
    }

    function zeigeFormular() {
      zeige(`
        <div class="card-icon">🔑</div>
        <h1>${L('neu')}</h1>
        <p class="card-sub">${L('neuText')}</p>

        <form id="formular" novalidate>
          <div class="field">
            <label for="pw">${L('neu')}</label>
            <div class="input-wrap">
              <input type="password" id="pw" placeholder="${L('mind8')}" autocomplete="new-password" />
              <button class="toggle-pw" data-feld="pw" type="button" aria-label="${L('anzeigen')}">👁</button>
            </div>
          </div>

          <div class="field">
            <label for="pw2">${L('wiederholen')}</label>
            <div class="input-wrap">
              <input type="password" id="pw2" placeholder="${L('bestaetigen')}" autocomplete="new-password" />
              <button class="toggle-pw" data-feld="pw2" type="button" aria-label="${L('anzeigen')}">👁</button>
            </div>
          </div>

          <div class="requirements" aria-live="polite">
            <div class="req" id="req-len"><div class="req-dot"></div>${L('mind8')}</div>
            <div class="req" id="req-lower"><div class="req-dot"></div>${L('klein')}</div>
            <div class="req" id="req-upper"><div class="req-dot"></div>${L('gross')}</div>
            <div class="req" id="req-digit"><div class="req-dot"></div>${L('ziffer')}</div>
            <div class="req" id="req-match"><div class="req-dot"></div>${L('gleichPw')}</div>
          </div>

          <button class="btn-submit" id="submit-btn" type="submit" disabled>${L('speichern')}</button>
          <div class="msg" id="msg" role="alert"></div>
        </form>`);

      const pw = document.getElementById('pw');
      const pw2 = document.getElementById('pw2');
      pw.addEventListener('input', pruefePasswort);
      pw2.addEventListener('input', pruefePasswort);
      document.querySelectorAll('.toggle-pw').forEach((btn) =>
        btn.addEventListener('click', () => {
          const input = document.getElementById(btn.dataset.feld);
          const verdeckt = input.type === 'password';
          input.type = verdeckt ? 'text' : 'password';
          btn.textContent = verdeckt ? '🙈' : '👁';
          btn.setAttribute('aria-label', verdeckt ? L('verbergen') : L('anzeigen'));
        }));
      document.getElementById('formular').addEventListener('submit', (e) => {
        e.preventDefault();
        speichern();
      });
      pw.focus();
    }

    function pruefePasswort() {
      const pw = document.getElementById('pw').value;
      const pw2 = document.getElementById('pw2').value;
      const checks = {
        len: REGELN.len(pw), lower: REGELN.lower(pw), upper: REGELN.upper(pw), digit: REGELN.digit(pw),
        match: pw.length > 0 && pw === pw2,
      };
      for (const [key, ok] of Object.entries(checks)) {
        document.getElementById(`req-${key}`).className = 'req' + (ok ? ' ok' : '');
      }
      document.getElementById('submit-btn').disabled = !Object.values(checks).every(Boolean);
      document.getElementById('pw2').className = pw2.length > 0 && !checks.match ? 'error' : '';
      return checks;
    }

    async function speichern() {
      if (!Object.values(pruefePasswort()).every(Boolean)) return;
      const btn = document.getElementById('submit-btn');
      const msgEl = document.getElementById('msg');
      btn.disabled = true;
      btn.textContent = L('speichert');
      msgEl.className = 'msg';

      const { error } = await client.auth.updateUser({ password: document.getElementById('pw').value });
      if (error) {
        msgEl.textContent = fehlertext(error);
        msgEl.className = 'msg show error-msg';
        btn.textContent = L('speichern');
        btn.disabled = false;
        return;
      }
      await client.auth.signOut();
      zeigeErfolg();
    }

    async function start() {
      // Seite neu geladen? Dann ist der Link schon bestätigt und die Sitzung noch da.
      const { data } = await client.auth.getSession();
      if (data.session) return zeigeFormular();

      if (!tokenHash) {
        return zeigeUngueltig(L('unvollstaendig'));
      }
      zeigeLaden();
      const { error } = await client.auth.verifyOtp({ token_hash: tokenHash, type: 'recovery' });
      if (error) return zeigeUngueltig(fehlertext(error));
      // token_hash aus der Adresszeile entfernen (er ist jetzt verbraucht)
      history.replaceState(null, '', window.location.pathname);
      zeigeFormular();
    }

    start();
  </script>

</body>
</html>
